<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP — Digital Voting System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <p class="eyebrow">Two-Step Verification</p>
    <h1>Enter OTP</h1>
    <h2>We emailed a 6-digit code to verify it's really you</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flashes">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('voter_otp') }}">
      <label for="otp">6-digit OTP</label>
      <input type="text" id="otp" name="otp" inputmode="numeric" pattern="[0-9]*"
             maxlength="6" placeholder="123456" required autofocus>

      <button type="submit">Verify &amp; Continue</button>
    </form>

    <hr class="tear-line">
    <p class="center-link"><a href="{{ url_for('voter_login') }}">← Back to Login</a></p>
  </div>
</body>
</html>

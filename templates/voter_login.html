<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voter Login — Digital Voting System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <p class="eyebrow">Voter Access</p>
    <h1>Voter Login</h1>
    <h2>Enter your Voter ID and password to continue</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flashes">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('voter_login') }}">
      <label for="voter_id">Voter ID</label>
      <input type="text" id="voter_id" name="voter_id" placeholder="e.g. V001" required autofocus>

      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <button type="button" class="eye-toggle" id="eyeBtn" aria-label="Show password" onclick="togglePassword()">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <button type="submit">Login</button>
    </form>

    <hr class="tear-line">
    <p class="center-link"><a href="{{ url_for('home') }}">← Back to Home</a></p>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      const btn = document.getElementById('eyeBtn');
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      icon.innerHTML = showing
        ? '<path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="3"></circle>'
        : '<path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="3"></circle><line x1="3" y1="3" x2="21" y2="21"></line>';
    }
  </script>
</body>
</html>

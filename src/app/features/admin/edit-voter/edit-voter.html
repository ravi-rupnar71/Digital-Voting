<div class="container">
  <p class="eyebrow">Election Administration</p>
  <h1>Edit Voter</h1>
  <h2>Update the voter details below</h2>

  <ul class="flashes" *ngIf="messages && messages.length > 0">
    <li *ngFor="let message of messages">{{ message }}</li>
  </ul>

  <form [formGroup]="editVoterForm" (ngSubmit)="onSubmit()">
    <label for="voter_id">Voter ID</label>
    <input type="text" id="voter_id" formControlName="voter_id" autofocus>

    <label for="name">Voter Name</label>
    <input type="text" id="name" formControlName="name">

    <label for="email">Voter Email</label>
    <input type="email" id="email" formControlName="email">

    <label for="password">New Password (leave blank to keep current)</label>
    <input type="text" id="password" formControlName="password" placeholder="Optional">

    <button type="submit" [disabled]="editVoterForm.invalid">Save Changes</button>
  </form>

  <hr class="tear-line">
  
  <p class="center-link">
    <a routerLink="/admin-dashboard">← Back to Dashboard</a>
  </p>
</div>
